# Pre-commit hooks for QIVC v2.0
# Install:  uv run pre-commit install
# Run all:  uv run pre-commit run --all-files
#
# All hooks run the project's own pinned tools via `uv run`, so they match CI
# exactly and need no separate hook-env downloads.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy (strict, src/qivc)
        entry: uv run mypy src/qivc
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest (fast unit tests)
        entry: uv run pytest tests/unit -q
        language: system
        types: [python]
        pass_filenames: false
